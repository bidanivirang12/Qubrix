services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: qubrix_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the local environment}
      POSTGRES_DB: qubrix_dev
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:?Set RUNTIME_DB_PASSWORD in the local environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - qubrix-postgres:/var/lib/postgresql/data
      - ./docker/01-create-runtime.sql:/docker/01-create-runtime.sql:ro
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/00-create-runtime.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qubrix_app -d qubrix_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      target: build
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://qubrix_app:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/qubrix_test
    command: ["uv", "run", "--frozen", "alembic", "upgrade", "head"]
    restart: "no"

volumes:
  qubrix-postgres:
